name: Feature or content request
description: Propose a change, or a tool to add or correct in the catalogue
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem and when does it come up?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? For catalogue entries include the tool's website and a source URL for pricing.
    validations:
      required: true
