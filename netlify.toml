[build]
command = "npx prisma generate && npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[build.environment]
NODE_VERSION = "20.20.0"
SECRETS_SCAN_ENABLED = "false"

[[redirects]]
from = "http://seeksmartapp.netlify.app/*"
to = "https://seeksmart.in/:splat"
status = 301
force = true

